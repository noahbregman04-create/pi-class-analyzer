<style>
/* Layout: league ledger. Your stat strip on top, a scrollable tab bar, one panel per tab. Tabs add their own CSS below. */
:root {

  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #101714; --slip: #17201c; --ink: #e3ebe6; --muted: #98a8a0; --rule: #2b3832;
  --flag: #f0b43a; --win: #5fcf8f; --win-soft: #1d3a2a; --loss: #f08277; --loss-soft: #3d2220; --warn: #e3b14e; --chip: #223029; color-scheme: dark } }
:root[data-theme="dark"] {
  --ground: #101714; --slip: #17201c; --ink: #e3ebe6; --muted: #98a8a0; --rule: #2b3832;
  --flag: #f0b43a; --win: #5fcf8f; --win-soft: #1d3a2a; --loss: #f08277; --loss-soft: #3d2220; --warn: #e3b14e; --chip: #223029; color-scheme: dark }
body { background: var(--ground); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1; }
h2 { font-size: 1.45rem; line-height: 1.1; }
h3 { font-size: 1.15rem; }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.fresh, .note { color: var(--muted); font-size: .85rem; margin: 0; max-width: 72ch; }
.fresh { margin-top: 6px; }
.muted { color: var(--muted); }
.refresh-row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 8px; font-size: .85rem; }
.refresh-row button { font: 600 .85rem var(--body); padding: 5px 12px; border-radius: 99px; border: 1px solid var(--ink); background: var(--ink); color: var(--slip); cursor: pointer; }
.refresh-row button:disabled { opacity: .5; cursor: default; }
nav { display: flex; gap: 2px; border-bottom: 2px solid var(--rule); overflow-x: auto; scrollbar-width: thin; }
nav button { font: 600 1.02rem var(--display); letter-spacing: .03em; text-transform: uppercase; background: none; border: 0; color: var(--muted);
  padding: 8px 12px; border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; white-space: nowrap; }
nav button[aria-selected="true"] { color: var(--ink); border-color: var(--flag); }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--flag); outline-offset: 2px; }
.panel { display: grid; gap: 16px; min-width: 0; }
.panel[hidden], [data-view][hidden] { display: none; }
.stack { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--slip); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.score, .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.score > div, .strip > div { background: var(--slip); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; align-content: start; }
.score b, .strip b { font: 600 1.6rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.score span, .strip span { font-size: .78rem; color: var(--muted); }
.score small, .strip small { font-size: .82rem; overflow-wrap: anywhere; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: 600 .85rem var(--body); padding: 5px 12px; border-radius: 99px; border: 1px solid var(--rule); background: var(--slip); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--slip); border-color: var(--ink); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .88rem; }
.filters select, .filters input { font: inherit; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--slip); color: var(--ink); max-width: 100%; }
.filters label { display: flex; gap: 6px; align-items: center; }
.count { color: var(--muted); margin-left: auto; }
.list { display: grid; gap: 8px; }
.pos { font: 500 .72rem var(--mono); color: var(--muted); padding: 1px 5px; border: 1px solid var(--rule); border-radius: 3px; margin-right: 4px; }
.pts { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; }
.pts.up { color: var(--win); } .pts.down { color: var(--loss); }
.pill { font: 600 .72rem var(--body); text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--ink); white-space: nowrap; }
.chip { font-size: .75rem; background: var(--chip); padding: 1px 7px; border-radius: 3px; white-space: nowrap; }
.chip.warn { color: var(--warn); } .chip.bad { color: var(--loss); background: var(--loss-soft); } .chip.good { color: var(--win); background: var(--win-soft); }
.table-wrap { overflow-x: auto; background: var(--slip); border: 1px solid var(--rule); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 600 .74rem var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
tr.mine td { background: var(--chip); }
tr:last-child td { border-bottom: 0; }
.empty { color: var(--muted); padding: 20px; text-align: center; }
.ov-sort { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
th[aria-sort] .ov-sort { color: var(--ink); }
.ov-awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.ov-awards .card { gap: 4px; align-content: start; }

.ov-lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.ov-weeks { margin: 0; padding-left: 1.6em; display: grid; gap: 4px; }

.ov-weeks li[hidden] { display: none; }
.ov-weeks b { float: right; }

.tw-list { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.tw-lineups { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; min-width: 0; }
.tw-league { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .tw-lineups, .tw-league { grid-template-columns: 1fr; } }

.db-list { margin: 0; padding: 0; list-style: none; }
.db-list li { overflow-wrap: anywhere; }
.db-list li.db-mine { background: var(--chip); border-radius: 4px; padding: 2px 6px; }

/* Rosters tab: team value cards, movers, sortable positional table. Shared tokens only. */
.ro-movegrid { display: flex; flex-wrap: wrap; gap: 8px 32px; }
.ro-movegrid h4 { margin: 0 0 4px; font: 600 .85rem var(--body); color: var(--muted); }
.ro-movers { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }

.ro-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.ro-card { background: var(--slip); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; }
.ro-card.mine { border-left: 4px solid var(--flag); }
.ro-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.ro-rank { font: 600 .9rem var(--mono); color: var(--muted); }
.ro-vals { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; }
.ro-vals dt { font-size: .72rem; color: var(--muted); }
.ro-vals dd { margin: 0; font: .9rem var(--mono); font-variant-numeric: tabular-nums; }
.ro-sort { all: unset; cursor: pointer; font: inherit; }
.ro-sort:focus-visible { outline: 2px solid var(--flag); outline-offset: 2px; }
#ro-table td.num { color: var(--ink); }
#ro-table td.num small { color: var(--muted); }

/* Trades tab: trade cards. Shared tokens only. */
.tr-card { background: var(--slip); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; display: grid; gap: 10px; }
.tr-card.mine { border-left: 4px solid var(--flag); }
.tr-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .82rem; color: var(--muted); }
.tr-top strong { color: var(--ink); font-weight: 600; font-size: .95rem; }
.tr-verb { font-family: var(--display); text-transform: uppercase; letter-spacing: .04em; color: var(--flag); }
.tr-sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.tr-side { border: 1px solid var(--rule); border-radius: 4px; padding: 8px 10px; }
.tr-side.won { border-color: var(--win); background: var(--win-soft); }
.tr-side h4 { margin: 0 0 6px; font-size: .85rem; }
.tr-side ul { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 3px; }
.tr-side li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; font-size: .88rem; }
.tr-nums { font: .78rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.tr-side dl { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; }
.tr-side dl div { display: flex; gap: 6px; color: var(--muted); }
.tr-side dd { margin: 0; font-family: var(--mono); color: var(--ink); }
.tr-side .tr-decides dt, .tr-side .tr-decides dd { font-weight: 700; color: var(--ink); }
.tr-why { margin: 0; font-size: .82rem; color: var(--muted); }
.tr-g0 { background: var(--chip); color: var(--muted); }
.tr-g1 { background: var(--win-soft); color: var(--win); }
.tr-g2 { background: var(--win); color: var(--slip); }
.tr-g3, .tr-g4 { background: var(--loss-soft); color: var(--loss); }

/* Trade Watch tab. Shared tokens only. */
.tw2-card.mine { border-left: 4px solid var(--flag); }
.tw2-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .85rem; }
.tw2-sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.tw2-side h4 { margin: 0 0 4px; font-size: .85rem; }
.tw2-side ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: .9rem; }
.tw2-votes { margin: 4px 0 0; padding-left: 1.4em; display: grid; gap: 2px; font-size: .85rem; }

.calc-sides { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
.calc-side { flex: 1 1 320px; min-width: 0; display: grid; gap: 8px; align-content: start; }
.calc-label { display: grid; gap: 4px; font-size: .78rem; color: var(--muted); }
.calc-label select { font: 600 .95rem var(--body); padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--slip); color: var(--ink); max-width: 100%; }
.calc-roster { display: grid; gap: 4px; max-height: 520px; overflow-y: auto; }

.calc-player[aria-pressed="true"] { background: var(--win-soft); border-color: var(--win); }
.calc-name { min-width: 0; overflow-wrap: anywhere; }
.calc-nums { display: grid; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }

.calc-foot { margin: 4px 0 0; font: 600 .85rem var(--mono); }

.tv2-table { min-width: 760px; }
.tv2-row, .tv2-combo { cursor: pointer; }

.tv2-tend dt { color: var(--muted); font-size: .76rem; }

  text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.zf-sub { display: block; font-size: .85rem; color: var(--muted); margin-top: 2px; }
#zf-more-wrap[hidden] { display: none; }
#zf-team { max-width: min(100%, 320px); }

.slip { background: var(--slip); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; }
.slip.mine { border-left: 4px solid var(--flag); }
.slip .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .82rem; color: var(--muted); }
.slip .top strong { color: var(--ink); font-weight: 600; }
.moves { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; }
.add { font-weight: 600; }
.add::before { content: "+ "; color: var(--win); font-family: var(--mono); }
.drop { color: var(--muted); }
.drop::before { content: "\2212 "; color: var(--loss); font-family: var(--mono); }
.verdict { font-size: .9rem; }
.g-Jackpot { background: var(--win); color: var(--slip); }
.g-Great-Add, .g-Good-Add { background: var(--win-soft); color: var(--win); }
.g-Miss { background: var(--loss-soft); color: var(--loss); }
.g-Pending { background: none; border: 1px dashed var(--muted); color: var(--muted); }
.g-Cut-early, .g-Depth { color: var(--muted); }
details summary { cursor: pointer; font-size: .8rem; color: var(--muted); width: fit-content; }
.weeks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.weeks span { font: 500 .78rem var(--mono); padding: 2px 6px; border-radius: 3px; background: var(--chip); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.legend span { display: flex; gap: 6px; align-items: center; }

</style>

const LEAGUE = `${BASE}/segments/0/leagues/${LEAGUE_ID}`;
const FANTASYCALC = 'https://api.fantasycalc.com/values/current?isDynasty=false&numQbs=1&numTeams=12&ppr=1';

                                                            
                                                                       
                            
                                                               
                                              
                                             
                                                                         
 

async function getJson(url        , filter         ) {
  const res = await fetch(url, filter ? { headers: { 'X-Fantasy-Filter': JSON.stringify(filter) } } : undefined);
  if (!res.ok) throw new Error(`${new URL(url).host} returned ${res.status} for ${url}`);
  return res.json();
}

// ESPN returns a week's projection only when that week is named by code ("11" + season + week), so ask for the
// current week and the next two: that is what K/D/ST streaming and the lineup check need.
const PROJ_WEEKS_AHEAD = 2;
const playersFilter = (extra        , week        ) => {
  const weekly = Array.from({ length: PROJ_WEEKS_AHEAD + 1 }, (_, i) => `11${SEASON}${week + i}`);
  return { players: { filterStatsForTopScoringPeriodIds: { value: 17, additionalValue: [`00${SEASON}`, `10${SEASON}`, ...weekly] }, ...extra } };
};

function stat(stats       , source        , week        , split        ) {
  return stats.find(s => s.seasonId === SEASON && s.statSourceId === source && s.scoringPeriodId === week && s.statSplitTypeId === split);
}

function toPlayer(pl     , pro                                              )             {
  const stats = pl.stats ?? [];
  const season = stat(stats, 0, 0, 0);
  const ppg = season?.appliedAverage ?? 0;
  const weekPts                         = {};
  const weekProj                         = {};
  for (const s of stats) {
    if (s.seasonId !== SEASON || s.statSplitTypeId !== 1 || !s.scoringPeriodId) continue;
    if (s.statSourceId === 0) weekPts[s.scoringPeriodId] = s.appliedTotal ?? 0;
    else if (s.statSourceId === 1) weekProj[s.scoringPeriodId] = s.appliedTotal ?? 0;
  }
  const team = pro.get(pl.proTeamId);
  return {
    id: pl.id, name: pl.fullName, pos: POS[pl.defaultPositionId] ?? '?', nfl: team?.abbrev ?? 'FA', bye: team?.bye ?? null,
    injury: pl.injuryStatus ?? '', ppg: Math.round(ppg * 10) / 10, games: ppg ? Math.round((season.appliedTotal ?? 0) / ppg) : 0,
    owned: Math.round(pl.ownership?.percentOwned ?? 0), weekPts, weekProj,
  };
}

// Trade engine v2 (docs/trade-v2-spec.md 3.1): without filterStatsForTopScoringPeriodIds the weekly splits are missing.
function toPoolPlayer(x     )                 {
  const pl = x.player, stats = pl.stats ?? [];
  const weeks                          = {};
  for (const s of stats) {
    if (s.seasonId !== SEASON || s.statSourceId !== 0 || s.statSplitTypeId !== 1) continue;
    if (!s.stats || !Object.keys(s.stats).length || weeks[s.scoringPeriodId]) continue; // empty stats = did not play
    weeks[s.scoringPeriodId] = { pts: s.appliedTotal ?? 0, targets: s.stats['58'] ?? 0, carries: s.stats['23'] ?? 0, receptions: s.stats['53'] ?? 0 };
  }
  return { id: x.id, name: pl.fullName, pos: POS[pl.defaultPositionId] ?? '?', proTeamId: pl.proTeamId, injury: pl.injuryStatus ?? '',
    status: x.status, owned: pl.ownership?.percentOwned ?? 0, rosPpg: stat(stats, 1, 0, 0)?.appliedAverage ?? null, weeks };
}

async function fetchEnginePool(get           , week        )                            {
  const r = await get(`${LEAGUE}?view=kona_player_info&scoringPeriodId=${week}`, { players: { limit: ENGINE_POOL,
    sortPercOwned: { sortPriority: 1, sortAsc: false },
    filterStatsForTopScoringPeriodIds: { value: week, additionalValue: [`00${SEASON}`, `10${SEASON}`, `00${SEASON - 1}`] } } });
  return (r.players ?? []).map(toPoolPlayer);
}

function nflSchedule(proTeams       )                              {
  return Object.fromEntries(proTeams.map(t => [t.id, { bye: t.byeWeek ?? null, abbrev: String(t.abbrev ?? '').toUpperCase(), opp: Object.fromEntries(
    Object.entries       (t.proGamesByScoringPeriod ?? {}).map(([w, g]) => [w, g[0].homeProTeamId === t.id ? g[0].awayProTeamId : g[0].homeProTeamId])) }]));
}

// Batches run in parallel; `limit` must be left out for id lookups.
async function fetchPlayersById(get           , ids          , week        ) {
  const batches = Array.from({ length: Math.ceil(ids.length / ID_BATCH) }, (_, k) => ids.slice(k * ID_BATCH, (k + 1) * ID_BATCH));
  const found = await Promise.all(batches.map(b =>
    get(`${LEAGUE}?view=kona_player_info&scoringPeriodId=${week}`, playersFilter({ filterIds: { value: b } }, week))));
  return found.flatMap(r => r.players ?? []).map(p => p.player);
}

// Trades in ESPN's review window carry their players; vetoed or processed ones never do again, so remember every one.
function mergeLedger(old        , pending       , seenAt        )         {
  const byId = new Map(old.map(p => [p.id, p]));
  for (const p of pending) {
    if (!p.id || !Array.isArray(p.items)) continue;
    byId.set(p.id, { id: p.id, acceptedDate: p.acceptedDate ?? p.proposedDate ?? 0, expirationDate: p.expirationDate ?? 0,
      seenAt: byId.get(p.id)?.seenAt ?? seenAt,
      items: p.items.filter((i     ) => i.type === 'TRADE').map((i     ) => ({ playerId: i.playerId, from: i.fromTeamId, to: i.toTeamId })) });
  }
  return [...byId.values()].sort((a, b) => a.acceptedDate - b.acceptedDate);
}

function fantasyCalcValues(fc     )                     {
  const values = (Array.isArray(fc) ? fc : []).filter((v     ) => v?.player?.espnId).map((v     ) => ({ espnId: Number(v.player.espnId), name: v.player.name,
    pos: v.player.position, value: v.value, trend30Day: v.trend30Day ?? 0, positionRank: v.positionRank }));
  if (values.length < MIN_FC_VALUES) throw new Error(`FantasyCalc returned ${values.length} player values (need ${MIN_FC_VALUES}+); not saving a snapshot with missing trade values`);
  return values;
}

const ZACH = 'Zach Savage';
const SKILL = new Set(['QB', 'RB', 'WR', 'TE']);
const MIN_ZACH_ROWS = 100; // Zach ranks a few hundred skill players; fewer means Flock is down or changed shape

function zachRanks(j     )                                {
  const list = parseFlock(j, [ZACH])[ZACH].filter(x => SKILL.has(x.p));
  if (list.length < MIN_ZACH_ROWS) throw new Error(`Flock returned ${list.length} QB/RB/WR/TE rows for ${ZACH} (need ${MIN_ZACH_ROWS}+)`);
  const ts = j.lastUpdated?.[ZACH];
  return { updated: ts == null ? null : String(ts), list };
}

function rosterWeek(r     , w        , current        , players                            , pro                                              ) {
  return Object.fromEntries(r.teams.map((team     ) => [team.id, team.roster.entries.map((e     )            => {
    const pl = e.playerPoolEntry.player;
    if (w === current || !players[pl.id]) players[pl.id] = toPlayer(pl, pro);
    return { id: pl.id, slot: SLOT[e.lineupSlotId] ?? 'BE', pts: stat(pl.stats ?? [], 0, w, 1)?.appliedTotal ?? 0,
      proj: stat(pl.stats ?? [], 1, w, 1)?.appliedTotal ?? 0 };
  })]));
}

async function fetchSnapshot({ rankings, ledger: oldLedger, fetchJson = getJson, log = () => {} }           )                                                  {
  const get = fetchJson;
  log('Fetching ESPN league settings...');
  const [league, proRes] = await Promise.all([
    get(`${LEAGUE}?view=mTeam&view=mSettings&view=mStatus&view=mMatchupScore&view=mDraftDetail&view=mPendingTransactions`),
    get(`${BASE}?view=proTeamSchedules_wl`)]);
  const pro = new Map                                         (proRes.settings.proTeams.map((t     ) => [t.id, { abbrev: t.abbrev.toUpperCase(), bye: t.byeWeek }]));
  const current         = league.status.latestScoringPeriod;
  const sched = league.settings.scheduleSettings;
  const regular         = sched.matchupPeriodCount;
  const playoffTeams         = sched.playoffTeamCount;
  const games = league.schedule.filter((m     ) => m.away && m.matchupPeriodId <= regular).map((m     ) => ({
    week: m.matchupPeriodId, home: m.home.teamId, away: m.away.teamId,
    homePts: m.home.totalPoints, awayPts: m.away.totalPoints, done: m.winner !== 'UNDECIDED',
  }));
  const completedWeeks = [...new Set(games.filter((g     ) => g.done).map((g     ) => g.week          ))].sort((a, b) => a - b);
  const h2hPlayed = (id        ) => games.filter((g     ) => g.done && (g.home === id || g.away === id)).length;
  const rec = league.teams[0].record.overall;
  const median = h2hPlayed(league.teams[0].id) > 0 && rec.wins + rec.losses + rec.ties === 2 * h2hPlayed(league.teams[0].id);

  log(`Fetching ESPN rosters and moves for weeks 1-${current}, free agents, the scoreboard and trade values...`);
  const extras = Promise.all([
    get(`${LEAGUE}?view=kona_player_info&scoringPeriodId=${current}`, playersFilter({
      filterStatus: { value: ['FREEAGENT', 'WAIVERS'] }, filterSlotIds: { value: [0, 2, 4, 6, 16, 17, 23] },
      sortPercOwned: { sortAsc: false, sortPriority: 1 }, limit: FREE_AGENT_POOL,
    }, current)),
    get(`${LEAGUE}?view=mScoreboard&view=mMatchupScore&scoringPeriodId=${current}`),
    fetchEnginePool(get, current),
    get(FANTASYCALC),
    // A Flock outage must not cost the whole refresh; the error rides on the snapshot so the page can show it.
    get(FLOCK_URL).then(zachRanks).catch((e       ) => ({ updated: null, list: [], error: e.message })),
  ]);
  extras.catch(() => {}); // awaited below; this only stops an early failure from counting as unhandled meanwhile
  const weeks = await Promise.all(Array.from({ length: current }, (_, k) => Promise.all([
    get(`${LEAGUE}?view=mRoster&scoringPeriodId=${k + 1}`), get(`${LEAGUE}?view=mTransactions2&scoringPeriodId=${k + 1}`)])));

  const players                             = {};
  const rosters                      = {};
  const txById = new Map                ();
  weeks.forEach(([r, t], k) => { // week order matters: the current week's player record wins, first sighting of a move wins
    rosters[k + 1] = rosterWeek(r, k + 1, current, players, pro);
    for (const x of t.transactions ?? []) {
      if (LINEUP_MOVES.has(x.type) || txById.has(x.id)) continue;
      txById.set(x.id, { id: x.id, type: x.type, status: x.status, teamId: x.teamId, week: x.scoringPeriodId,
        date: x.processDate ?? x.proposedDate ?? 0,
        items: (x.items ?? []).map((i     ) => ({ type: i.type, playerId: i.playerId, fromTeamId: i.fromTeamId, toTeamId: i.toTeamId })) });
    }
  });
  const transactions = [...txById.values()].sort((a, b) => a.date - b.date);
  const draft = (league.draftDetail?.picks ?? []).map((p     ) => ({ pick: p.overallPickNumber, round: p.roundId, teamId: p.teamId, playerId: p.playerId }));

  // Weekly roster responses carry only ~2 weeks of stats, so every rostered, moved or drafted player gets a full-season fetch.
  const everyone = new Set        ([
    ...transactions.flatMap(t => t.items.map(i => i.playerId)), ...draft.map((d     ) => d.playerId          ),
    ...Object.values(rosters[current] ?? {}).flatMap(r => r.map(e => e.id)),
  ]);
  log(`Fetching full-season stats for ${everyone.size} players...`);
  const [byId, [faRes, board, pool, fc, zach]] = await Promise.all([fetchPlayersById(get, [...everyone], current), extras]);
  const values = fantasyCalcValues(fc);
  const freeAgents           = [];
  for (const p of faRes.players ?? []) { players[p.player.id] = toPlayer(p.player, pro); freeAgents.push(p.player.id); }
  for (const pl of byId) players[pl.id] = toPlayer(pl, pro);
  const live = board.schedule.filter((m     ) => m.matchupPeriodId === current && m.away)
    .flatMap((m     ) => [m.home, m.away].map((s     ) => ({ teamId: s.teamId, live: s.totalPointsLive ?? 0, projLive: s.totalProjectedPointsLive ?? 0 })));
  const fetchedAt = new Date().toISOString();
  const ledger = mergeLedger(oldLedger, league.pendingTransactions ?? [], fetchedAt);

  const snapshot           = {
    season: SEASON, leagueId: LEAGUE_ID, myTeamId: MY_TEAM_ID, fetchedAt,
    currentWeek: current, completedWeeks, regularSeasonWeeks: regular, playoffTeams,
    byes: 2 ** Math.ceil(Math.log2(playoffTeams)) - playoffTeams, median,
    lineupSlotCounts: league.settings.rosterSettings.lineupSlotCounts,
    teams: league.teams.map((t     ) => ({ id: t.id, name: t.name, abbrev: t.abbrev, wins: t.record.overall.wins,
      losses: t.record.overall.losses, pf: t.record.overall.pointsFor, pa: t.record.overall.pointsAgainst })),
    games, live, rosters, players, transactions, draft, freeAgents, values, rankings,
    pendingTrades: ledger, pool, nflSchedule: nflSchedule(proRes.settings.proTeams), zach,
  };
  return { snapshot, ledger };
}

return { LEAGUE_ID, SEASON, MY_TEAM_ID, getJson, mergeLedger, zachRanks, fetchSnapshot };
})();

// Overview math: records (head-to-head plus optional vs-median game), points, all-play, luck,
// efficiency, consistency, awards. Pure functions, no I/O.

                                                                                                                   
                             
                                                                               
                                                                                                                     
 
                                                                       

const round = (x        , d = 2) => Math.round(x * 10 ** d) / 10 ** d;

function weeklyScores(games        )                                   {
  const weeks = new Map                             ();
  for (const g of games.filter(x => x.done)) {
    const w = weeks.get(g.week) ?? new Map                ();
    w.set(g.home, g.homePts).set(g.away, g.awayPts);
    weeks.set(g.week, w);
  }
  return weeks;
}

// maxPf = each team's best-possible-lineup points over the same finished weeks.
function teamSeasons(games        , maxPf                     , opts                     )               {
  const weeks = weeklyScores(games);
  const teams = [...new Set(games.flatMap(g => [g.home, g.away]))];
  return teams.map(id => {
    const mine = games.filter(g => g.done && (g.home === id || g.away === id))
      .map(g => g.home === id ? { pts: g.homePts, opp: g.awayPts, week: g.week } : { pts: g.awayPts, opp: g.homePts, week: g.week });
    const h2hWins = mine.filter(m => m.pts > m.opp).length;
    const h2hLosses = mine.filter(m => m.pts < m.opp).length;
    let medianWins = 0, allPlay = 0;
    for (const m of mine) {
      const others = [...weeks.get(m.week) .entries()].filter(([t]) => t !== id).map(([, p]) => p);
      const beaten = others.filter(p => m.pts > p).length;
      allPlay += beaten / others.length;
      if (beaten >= others.length / 2) medianWins++; // top half of the league that week
    }
    const n = mine.length;
    const pf = round(mine.reduce((s, m) => s + m.pts, 0));
    const avg = n ? pf / n : 0;
    const sd = n ? Math.sqrt(mine.reduce((s, m) => s + (m.pts - avg) ** 2, 0) / n) : 0;
    const max = maxPf.get(id) ?? 0;
    return {
      teamId: id, h2hWins, games: n,
      wins: h2hWins + (opts.median ? medianWins : 0), losses: h2hLosses + (opts.median ? n - medianWins : 0),
      pf, pa: round(mine.reduce((s, m) => s + m.opp, 0)), maxPf: round(max), avgPf: round(avg, 1),
      effPct: max ? round(pf / max, 3) : 0, allPlayPct: n ? round(allPlay / n, 3) : 0,
      luck: round(h2hWins - allPlay), sd: round(sd, 1),
    };
  });
}

const best =    (xs     , score                  ) => xs.reduce((a, b) => (score(b) > score(a) ? b : a));

function awards(seasons              )          {
  const pct = (x        ) => `${Math.round(x * 100)}%`;
  const rec = best(seasons, t => t.wins * 1e4 + t.pf);
  const top = best(seasons, t => t.pf);
  const power = best(seasons, t => t.allPlayPct);
  const eff = best(seasons, t => t.effPct);
  const steady = best(seasons, t => -t.sd);
  const lucky = best(seasons, t => t.luck);
  const unlucky = best(seasons, t => -t.luck);
  return [
    { title: 'Best Record', teamId: rec.teamId, value: `${rec.wins}-${rec.losses}` },
    { title: 'Top Scorer', teamId: top.teamId, value: `${top.pf.toFixed(1)} pts` },
    { title: 'Power House', teamId: power.teamId, value: `${pct(power.allPlayPct)} all-play` },
    { title: 'Most Efficient', teamId: eff.teamId, value: `${pct(eff.effPct)} of max` },
    { title: 'Most Consistent', teamId: steady.teamId, value: `±${steady.sd} pts/wk` },
    { title: 'Luckiest', teamId: lucky.teamId, value: `${lucky.luck > 0 ? '+' : ''}${lucky.luck} wins` },
    { title: 'Unluckiest', teamId: unlucky.teamId, value: `${unlucky.luck} wins` },
  ];
}

function scoringWeeks(games        ) {
  return games.filter(g => g.done)
    .flatMap(g => [{ teamId: g.home, week: g.week, pts: g.homePts }, { teamId: g.away, week: g.week, pts: g.awayPts }])
    .sort((a, b) => b.pts - a.pts);
}

return { weeklyScores, teamSeasons, awards, scoringWeeks };
})();

    const n = counts[id] ?? 0;

      a.href = LIVE_URL;
      a.textContent = 'Open the live site (refreshes on the spot)';
      a.className = 'refresh-live';
      row.append(a);
      checkListening();
    }
  }
  return { init };
})();

function initRefresh() { REFRESH.init(); }

// Overview tab: season stat tiles, sortable standings, awards, highest and lowest scoring weeks.
TAB('overview', (el, data, c) => {
  if (!data || !data.standings.length) { el.innerHTML = '<p class="empty">No finished weeks yet.</p>'; return; }
  const n1 = (x) => x.toFixed(1);
  const signed = (x, d = 1) => `<span class="pts ${c.ptsCls(x)}">${c.fmt(x, d)}</span>`;
  const COLS = [
    { key: 'team', label: 'Team', text: true, cell: (r) => `${c.teamName(r.teamId)}${c.isMe(r.teamId) ? ' <span class="chip good">You</span>' : ''}` },
    { key: 'wins', label: 'W', cell: (r) => r.wins },
    { key: 'losses', label: 'L', cell: (r) => r.losses },
    { key: 'winPct', label: 'Win%', cell: (r) => c.pct(r.winPct) },
    { key: 'pf', label: 'PF', cell: (r) => n1(r.pf) },
    { key: 'pa', label: 'PA', cell: (r) => n1(r.pa) },
    { key: 'diff', label: '+/-', cell: (r) => signed(r.diff) },
    { key: 'avgPf', label: 'Avg PF', cell: (r) => n1(r.avgPf) },
    { key: 'effPct', label: 'Eff%', cell: (r) => c.pct(r.effPct, 1) },
    { key: 'maxPf', label: 'Max PF', cell: (r) => n1(r.maxPf) },
    { key: 'allPlayPct', label: 'All-play', cell: (r) => c.pct(r.allPlayPct) },
    { key: 'luck', label: 'Luck', cell: (r) => signed(r.luck, 2) },
  ];
  let sort = { key: 'diff', dir: -1 };

  function tiles() {
    const t = data.tiles;
    const tile = (label, value, team, note = '') =>
      `<div><span>${label}</span><b>${value}</b><small>${team ? c.teamName(team) : ''}${note}</small></div>`;
    return `<div class="score">
      ${tile('Games played', data.weeks, null, 'finished weeks')}
      ${tile('Best record', `${t.bestRecord.wins}-${t.bestRecord.losses}`, t.bestRecord.teamId)}
      ${tile('Avg points leader', n1(t.avgLeader.avgPf), t.avgLeader.teamId)}
      ${tile('Most efficient', c.pct(t.efficient.effPct, 1), t.efficient.teamId)}
      ${tile('Most consistent', `+/-${n1(t.consistent.sd)}`, t.consistent.teamId, ' (weekly spread)')}
    </div>`;
  }

  function rows() {
    const val = (r) => sort.key === 'team' ? c.team(r.teamId).name.toLowerCase() : r[sort.key];
    const sorted = [...data.standings].sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * sort.dir);
    return sorted.map(r => `<tr${c.isMe(r.teamId) ? ' class="mine"' : ''}>${COLS.map(col =>
      `<td${col.text ? '' : ' class="num"'}>${col.cell(r)}</td>`).join('')}</tr>`).join('');
  }

  function head() {
    return COLS.map(col => {
      const on = col.key === sort.key, aria = on ? ` aria-sort="${sort.dir < 0 ? 'descending' : 'ascending'}"` : '';
      return `<th${col.text ? '' : ' class="num"'}${aria}><button class="ov-sort" data-k="${col.key}">${col.label}${on ? (sort.dir < 0 ? ' ▾' : ' ▴') : ''}</button></th>`;
    }).join('');
  }

  function weekList(id, title, list) {
    const li = (w) => `<li><span>${c.teamName(w.teamId)} <span class="muted">Wk ${w.week}</span></span><b class="pts">${w.pts.toFixed(2)}</b></li>`;
    return `<div class="card"><h3>${title}</h3><ol class="ov-weeks" id="${id}">${list.map((w, i) =>
      li(w).replace('<li>', i < 5 ? '<li>' : '<li hidden>')).join('')}</ol>
      ${list.length > 5 ? `<div class="seg"><button class="ov-more" data-list="${id}" aria-pressed="false">Show ${list.length}</button></div>` : ''}</div>`;
  }

  el.innerHTML = `${tiles()}
    <div class="stack"><h2>Standings</h2>
      <div class="table-wrap"><table id="ov-table"><thead><tr>${head()}</tr></thead><tbody>${rows()}</tbody></table></div>
      <p class="note">W-L counts two results a week: the head-to-head game plus a game against the league median (top half that week wins).
      Eff% is points scored divided by Max PF, the best lineup you could have started from your roster.
      All-play is how often your score would beat every other team's score that week.
      Luck is head-to-head wins minus the wins your scores would earn against an average opponent (all-play); positive means your schedule helped.</p></div>
    <div class="stack"><h2>Awards</h2><div class="ov-awards">${data.awards.map(a => `<div class="card">
      <span class="pill">${c.esc(a.title)}</span><strong>${c.teamName(a.teamId)}</strong><b class="pts">${c.esc(a.value)}</b>
      <small class="muted">${c.esc(a.note)}</small></div>`).join('')}</div></div>
    <div class="ov-lists">${weekList('ov-high', 'Highest scoring weeks', data.high)}${weekList('ov-low', 'Lowest scoring weeks', data.low)}</div>`;

  const table = el.querySelector('#ov-table');
  table.querySelector('thead').addEventListener('click', (e) => {
    const k = e.target.closest('.ov-sort')?.dataset.k;
    if (!k) return;
    sort = { key: k, dir: sort.key === k ? -sort.dir : (k === 'team' ? 1 : -1) };
    table.querySelector('thead tr').innerHTML = head();
    table.querySelector('tbody').innerHTML = rows();
  });
  for (const b of el.querySelectorAll('.ov-more')) b.addEventListener('click', () => {
    const open = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(open));
    b.textContent = open ? 'Show 5' : `Show ${el.querySelectorAll(`#${b.dataset.list} li`).length}`;
    el.querySelectorAll(`#${b.dataset.list} li`).forEach((li, i) => { li.hidden = !open && i >= 5; });
  });
});

// This Week tab: lineup check and alerts, Noah's matchup with both lineups, then every other matchup.
TAB('thisweek', (el, data, c) => {
  if (!data) { el.innerHTML = '<p class="empty">No This Week data.</p>'; return; }
  const n1 = (x) => Number(x).toFixed(1);
  const rec = (id) => { const t = c.team(id); return `${t.wins}-${t.losses}`; };
  const favLine = (m) => {
    const gap = m.a.proj - m.b.proj;
    if (Math.abs(gap) < 0.05) return 'Dead even on projections';
    return `${c.teamName(gap > 0 ? m.a.team : m.b.team)} by ${n1(Math.abs(gap))}`;
  };

  function checkCard(mine) {
    const swaps = mine.swaps.map(w => {
      const p = c.player(w.start);
      return `<li>Start ${c.esc(p.name)} (${c.esc(p.pos)}, ${n1(w.startProj)}) over ${c.esc(c.player(w.sit).name)} (${n1(w.sitProj)})
        <span class="pts up">+${n1(w.gain)}</span></li>`;
    }).join('');
    const alerts = mine.alerts.map(a => {
      const who = a.playerId !== undefined ? c.pname(a.playerId) : `${c.esc(a.slot)} slot`;
      return `<li><span class="chip ${a.level === 'mistake' ? 'bad' : 'warn'}">${c.esc(a.reason)}</span> ${who}</li>`;
    }).join('');
    const head = mine.gap > 0
      ? `<h3><span class="pts down">${n1(mine.gap)}</span> points left on your bench</h3>
         <p class="muted">Your starters project ${n1(mine.current)}; your best lineup projects ${n1(mine.best)}.</p><ul class="tw-list">${swaps}</ul>`
      : `<h3>Your lineup is optimal</h3><p class="muted">No bench player projects more than a starter he could replace. Starters project ${n1(mine.current)}.</p>`;
    const warn = alerts ? `<p><b>Lineup alerts</b> (red = will score nothing or slot is empty, amber = might not play)</p><ul class="tw-list">${alerts}</ul>` : '';
    return `<div class="card">${head}${warn}</div>`;
  }

  function matchupScore(m) {
    const t = (s) => `<div><span>${c.teamName(s.team)} (${rec(s.team)})</span><b>${c.pct(s.winProb)}</b>
      <small>odds ${c.esc(s.odds)} · projected ${n1(s.proj)} · live ${n1(s.live)}</small></div>`;
    return `<div class="score">${t(m.a)}${t(m.b)}</div><p class="muted">${favLine(m)} on projections.</p>`;
  }

  function lineupTable(s) {
    const row = (p) => {
      const pl = c.player(p.id);
      return `<tr><td>${c.esc(p.slot)}</td><td>${c.pname(p.id)}${c.injuryChip(pl.injury)}${p.bye ? ' <span class="chip bad">bye</span>' : ''}</td>
        <td class="num">${n1(p.proj)}</td><td class="num">${n1(p.pts)}</td></tr>`;
    };
    const bench = s.bench.map(p => `<li>${c.pname(p.id)}${c.injuryChip(c.player(p.id).injury)} <span class="muted">${p.slot === 'IR' ? 'IR · ' : ''}proj ${n1(p.proj)}</span></li>`).join('');
    return `<div class="stack"><h4>${c.teamName(s.team)}</h4><div class="table-wrap"><table>
      <thead><tr><th>Slot</th><th>Player</th><th class="num">Proj</th><th class="num">Score</th></tr></thead>
      <tbody>${s.starters.map(row).join('')}</tbody></table></div>
      <details><summary>Bench (${s.bench.length})</summary><ul class="tw-list">${bench}</ul></details></div>`;
  }

  function leagueCard(m) {
    const t = (s) => `<div><span>${c.teamName(s.team)} (${rec(s.team)})</span><b>${c.pct(s.winProb)}</b>
      <small>odds ${c.esc(s.odds)} · proj ${n1(s.proj)} · live ${n1(s.live)}</small></div>`;
    return `<div class="card"><div class="score">${t(m.a)}${t(m.b)}</div><p class="muted">${favLine(m)}</p></div>`;
  }

  const mine = data.matchups.find(m => m.mine);
  const others = data.matchups.filter(m => !m.mine);
  el.innerHTML = `<div class="stack">
    <h2>Week ${data.week}</h2>
    ${checkCard(data.mine)}
    ${mine ? `<div class="card"><h3>Your matchup</h3>${matchupScore(mine)}
      <div class="tw-lineups">${lineupTable(mine.a)}${lineupTable(mine.b)}</div></div>` : '<p class="empty">No matchup for you this week.</p>'}
    <h3>Around the league</h3>
    <div class="tw-league">${others.map(leagueCard).join('')}</div>
    <p class="note">Projections are ESPN's (projected total = points scored so far plus ESPN's projection for players still to play).
      Win % is a bell-curve estimate: the projected gap divided by how much weekly scores in this league usually swing
      (a ${n1(data.sdDiff)}-point spread for a full week, narrowing as games finish), so it is a guess, not ESPN's number.</p>
  </div>`;
});

// Outlook tab: playoff and title odds from a simulation of the rest of the season.
TAB('outlook', (el, data, c) => {

  const rootLine = (x) => {

  el.innerHTML = `
    <section class="card stack">
      <h2>Your outlook</h2>
      <div class="score">
        <div><span>Projected finish</span><b>#${me.avgSeed.toFixed(1)}</b><small>average seed out of ${data.table.length}</small></div>
        <div><span>Projected record</span><b>${me.estWins.toFixed(1)}-${losses.toFixed(1)}</b><small>of ${data.totalGames} games (head-to-head + median)</small></div>
        <div><span>Playoff chance</span><b>${p(me.playoffPct)}</b></div>
        <div><span>Title chance</span><b>${p(me.titlePct)}</b></div>
      </div>
    </section>

    <section class="card stack">
      <h2>Your remaining schedule</h2>
      <p class="note">Your chance of winning each head-to-head game left.</p>
      <div class="score">${data.weeks.map(weekTile).join('')}</div>
    </section>

    <section class="stack">
      <h2>Projections for every team</h2>
      <div class="table-wrap"><table>
        <thead><tr><th class="num">#</th><th>Team</th><th class="num">Est. wins</th><th class="num">Playoff %</th><th class="num">Title %</th><th class="num">Schedule rank</th></tr></thead>
        <tbody>${data.table.map(row).join('')}</tbody>
      </table></div>
      <p class="note">Est. wins counts all ${data.totalGames} games, including the weekly median game. Schedule rank: 1 = hardest games left, by the average strength of remaining opponents (in brackets, their average simulated weekly score).</p>
    </section>

    <section class="card stack">
      <h2>This week's rooting guide (week ${data.thisWeek})</h2>
      <div class="score">
        <div><span>Playoff chance if you win</span><b>${p(data.ifWin)}</b></div>
        <div><span>Playoff chance if you lose</span><b>${p(data.ifLose)}</b></div>
        <div><span>What this week is worth</span><b>${swing === null ? '—' : `${swing.toFixed(1)} pts`}</b><small>percentage points</small></div>
      </div>
      ${data.rooting.length ? `<ul class="list">${data.rooting.map(rootLine).join('')}</ul>`
        : '<p class="empty">No other game this week moves your playoff odds by 0.5% or more.</p>'}
      <p class="note">The +% is how much higher your playoff chance is when that team wins. Sorted by impact; games under 0.5% are left out.</p>
    </section>

    <p class="note">How this works: the rest of the regular season is played out ${n} times on the computer, then the playoff bracket (top ${data.playoffTeams} by wins, then points for; top ${data.byes} get byes). Each percentage is the share of those ${n} seasons where it happened. It updates with each daily refresh.</p>
    <p class="note">Model assumptions (guesses, not ESPN's): this is the same engine and the same ${n} simulated seasons as Trade Calc v2, so the odds match that tab. Each player's expected weekly points blend expert rankings with his actual results so far, adjusted for that week's opponent, byes and injuries; ESPN projections are not used. Each team starts its best expected lineup every week. A team's weekly score typically swings about ${data.sd} points around its own average. Points already scored this week are not counted.</p>`;
});

    </div>
    <h3>Teams ranked by total roster value</h3>
    <div class="ro-cards">${data.teams.map(card).join('')}</div>
    <p class="note">Value is FantasyCalc redraft trade value (12-team, PPR). Starters are the players in ESPN starting slots this week; bench includes IR. ${method}</p>
    <h3>Positional strengths</h3>
    <div class="seg" role="group" aria-label="Which players count">
      <button data-m="all" aria-pressed="true">Total roster</button><button data-m="start" aria-pressed="false">Starters only</button>
    </div>
    <div class="table-wrap"><table id="ro-table"></table></div>
    <p class="note">Each cell is the summed trade value at that position, with the league rank (#1 = most value). Greener is better, redder is worse. Click a column to sort.</p>`;

  let mode = 'all', key = 'Total', asc = false;
  const shade = (rank) => `background: color-mix(in srgb, var(--win-soft) ${Math.round(100 - ((rank - 1) / Math.max(n - 1, 1)) * 100)}%, var(--loss-soft))`;
  function drawTable() {
    const rows = [...data.teams].sort((a, b) => key === 'Team'
      ? c.team(a.id).name.localeCompare(c.team(b.id).name) * (asc ? 1 : -1)
      : (a.pos[mode][key].value - b.pos[mode][key].value) * (asc ? 1 : -1));
    const th = (k, cls = '') => `<th class="${cls}" aria-sort="${k === key ? (asc ? 'ascending' : 'descending') : 'none'}"><button class="ro-sort" data-k="${k}">${k}${k === key ? (asc ? ' ▲' : ' ▼') : ''}</button></th>`;
    $('ro-table').innerHTML = `<thead><tr>${th('Team')}${COLS.map(k => th(k, 'num')).join('')}</tr></thead><tbody>${rows.map(t =>
      `<tr${c.isMe(t.id) ? ' class="mine"' : ''}><td>${c.teamName(t.id)}</td>${COLS.map(k => {
        const x = t.pos[mode][k];
        return `<td class="num" style="${shade(x.rank)}">${num(x.value)} <small>#${x.rank}</small></td>`;
      }).join('')}</tr>`).join('')}</tbody>`;
    for (const b of el.querySelectorAll('.ro-sort')) b.addEventListener('click', () => {
      asc = b.dataset.k === key ? !asc : b.dataset.k === 'Team';
      key = b.dataset.k;
      drawTable();
    });
  }
  for (const b of el.querySelectorAll('[data-m]')) b.addEventListener('click', () => {
    mode = b.dataset.m;
    for (const x of el.querySelectorAll('[data-m]')) x.setAttribute('aria-pressed', String(x === b));
    drawTable();
  });
  drawTable();
});

TAB('trades', (el, data, c) => {

    return `<div class="tr-side${t.winner === x.teamId ? ' won' : ''}">

  el.innerHTML = `
    <div class="score">
      <div><span>Trades this season</span><b>${data.trades.length}</b><small>completed, not vetoed</small></div>
      <div><span>Your trades</span><b>${me.trades}</b><small>${me.w}-${me.l}-${me.e} won-lost-even</small></div>
      <div><span>Your net value</span><b class="pts ${c.ptsCls(me.netValue)}">${c.fmt(me.netValue, 0)}</b><small>value received minus sent</small></div>
      <div><span>Your net realized pts</span><b class="pts ${c.ptsCls(me.netPts)}">${c.fmt(me.netPts)}</b><small>started pts gained minus given</small></div>
    </div>
    <div class="seg" role="group" aria-label="Trade views">
      <button data-v="history" aria-pressed="true">Trade history</button><button data-v="league" aria-pressed="false">League overview</button>
    </div>
    <div data-view="history" class="stack">
      <div class="filters">
        <label>Team <select id="tr-team"><option value="">Any team</option><option value="me">My trades</option>${[...DATA.teams].sort((a, b) => a.name.localeCompare(b.name)).map(t => `<option value="${t.id}">${c.esc(t.name)}</option>`).join('')}</select></label>
        <label>Grade <select id="tr-grade"><option value="">All grades</option>${GRADES.map(g => `<option>${g}</option>`).join('')}</select></label>
        <label>Sort <select id="tr-sort"><option value="recent">Most recent</option><option value="lopsided">Most lopsided</option></select></label>
        <span class="count" id="tr-count"></span>
      </div>
      <div class="list" id="tr-list"></div>
      <p class="note">How a trade is graded: once 2 or more finished weeks have passed, by <b>realized points</b>, the points each side's new players scored in a starting slot for them (bench and IR do not count, and a player stops counting once he leaves that roster). Before that, by <b>value now</b>, today's FantasyCalc redraft trade value. Points gap: Even under 5, Slight Edge 5-15, Good Win 15-30, Clear Win 30-50, Fleece 50+. Value gap: Even under 500, Slight Edge 500-1,500, Good Win 1,500-3,000, Clear Win 3,000-5,000, Fleece 5,000+.</p>

    </div>
    <div data-view="league" class="stack" hidden>
      <div class="score">${tile('Best trader', data.best)}${tile('Worst trader', data.worst)}</div>
      <p class="note">Net value is the value now of every player a team received minus what it sent. Net realized pts is the starting points its new players scored minus what the players it sent scored for the other side. Best and worst trader rank by net value.</p>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>Team</th><th class="num">Trades</th><th class="num">W-L-E</th><th class="num">Net value</th><th class="num">Net realized pts</th></tr></thead><tbody>
      ${[...ranked, ...data.teams.filter(t => !t.trades)].map((t, i) => `<tr class="${c.isMe(t.teamId) ? 'mine' : ''}"><td class="num">${t.trades ? i + 1 : ''}</td><td>${c.teamName(t.teamId)}</td>
        <td class="num">${t.trades}</td><td class="num">${t.w}-${t.l}-${t.e}</td>
        <td class="num"><span class="pts ${c.ptsCls(t.netValue)}">${c.fmt(t.netValue, 0)}</span></td>
        <td class="num"><span class="pts ${c.ptsCls(t.netPts)}">${c.fmt(t.netPts)}</span></td></tr>`).join('')}
      </tbody></table></div>
    </div>`;

  const q = (s) => el.querySelector(s);
  const lopsided = (a, b) => GRADES.indexOf(b.grade) - GRADES.indexOf(a.grade) || b.gap - a.gap;
  const recent = (a, b) => b.week - a.week || (b.date ?? 0) - (a.date ?? 0);
  function renderList() {
    const team = q('#tr-team').value, g = q('#tr-grade').value;
    const has = (t) => !team || t.sides.some(x => (team === 'me' ? c.isMe(x.teamId) : x.teamId === Number(team)));
    const rows = data.trades.filter(t => has(t) && (!g || t.grade === g)).sort(q('#tr-sort').value === 'lopsided' ? lopsided : recent);
    q('#tr-count').textContent = `${rows.length} of ${data.trades.length} trades`;
    q('#tr-list').innerHTML = rows.length ? rows.map(card).join('') : '<p class="empty">No trades match these filters.</p>';
  }
  for (const id of ['#tr-team', '#tr-grade', '#tr-sort']) q(id).addEventListener('change', renderList);
  for (const b of el.querySelectorAll('.seg button')) b.addEventListener('click', () => {
    for (const o of el.querySelectorAll('.seg button')) o.setAttribute('aria-pressed', String(o === b));
    for (const v of el.querySelectorAll('[data-view]')) v.hidden = v.dataset.view !== b.dataset.v;
  });
  renderList();
});
