// Trade Calculator: pick two teams, click players into the trade, see value, lineup impact and partner fit.
// CALC mirrors the tested helpers in sections/calculator.ts; test/calculator.section.test.ts checks they agree.
const CALC = (() => {
  const TIERS = [[5000, 'Fleece'], [3000, 'Clear Win'], [1500, 'Good Win'], [500, 'Slight Edge']];
  const round1 = (x) => Math.round(x * 10) / 10;
  function bestLineup(players, slots) {
    const pool = [...players].sort((a, b) => b.pts - a.pts);
    const starters = new Set();
    let total = 0;
    for (const s of slots) {
      const pick = pool.find(p => s.eligible.includes(p.pos) && !starters.has(p.id));
      if (!pick) continue;
      starters.add(pick.id);
      total += pick.pts;
    }
    return { total: round1(total), starters };
  }
  const tradeTier = (gap) => TIERS.find(([min]) => Math.abs(gap) >= min)?.[1] ?? 'Even';
  function verdict(sentA, recvA) {
    const net = recvA - sentA;
    const tier = tradeTier(net);
    return { gap: Math.abs(net), tier, ahead: tier === 'Even' ? null : net > 0 ? 'A' : 'B' };
  }
  function lineupImpact(roster, slots, outIds, incoming) {
    const lineup = (ps) => bestLineup(ps.filter(x => !x.ir).map(x => ({ id: x.id, pos: x.pos, pts: x.ppg })), slots);
    const before = lineup(roster).total;
    const kept = roster.filter(x => !outIds.includes(x.id)).concat(incoming);
    const after = lineup(kept);
    const extra = kept.length - roster.length;
    const drops = extra <= 0 ? [] : kept.filter(x => !x.ir && !after.starters.has(x.id))
      .sort((a, b) => a.ppg - b.ppg).slice(0, extra).map(x => x.id);
    return { before, after: after.total, delta: Math.round((after.total - before) * 10) / 10, drops };
  }
  function acceptance(valueNet, lineupDelta, t) {
    const clamp = (x, hi) => Math.round(Math.min(hi, Math.max(0, x)));
    const value = clamp(30 + valueNet / 100, 60);
    const lineup = clamp(12.5 + lineupDelta * 2.5, 25);
    const recent = t.daysSince === null ? 0 : t.daysSince <= 14 ? 6 : t.daysSince <= 30 ? 3 : 0;
    const activity = Math.min(t.trades, 3) * 3 + recent;
    return { value, lineup, activity, total: value + lineup + activity };
  }
  return { tradeTier, verdict, lineupImpact, acceptance };
})();

TAB('calculator', (el, data, c) => {
  if (!data) { el.innerHTML = '<p class="empty">No roster data yet.</p>'; return; }
  const POS_ORDER = ['QB', 'RB', 'WR', 'TE', 'K', 'D/ST'];
  const ids = Object.keys(data.rosters).map(Number);
  const st = { a: data.myTeamId, b: ids.find(id => id !== data.myTeamId), sel: { a: new Set(), b: new Set() } };
  const num = (x) => Math.round(x).toLocaleString();
  const roster = (side) => data.rosters[st[side]] ?? [];
  const picked = (side) => roster(side).filter(p => st.sel[side].has(p.id));
  const sum = (ps) => ps.reduce((s, p) => s + p.value, 0);

  function picker(side) {
    const other = st[side === 'a' ? 'b' : 'a'];
    const opts = ids.filter(id => id !== other)
      .map(id => `<option value="${id}"${id === st[side] ? ' selected' : ''}>${c.teamName(id)}${c.isMe(id) ? ' (you)' : ''}</option>`).join('');
    const groups = [...new Set([...POS_ORDER, ...roster(side).map(p => p.pos)])].map(pos => {
      const ps = roster(side).filter(p => p.pos === pos).sort((x, y) => y.value - x.value || y.ppg - x.ppg);
      if (!ps.length) return '';
      return `<h4 class="calc-pos">${c.esc(pos)}</h4>` + ps.map(p => `<button type="button" class="calc-player" data-side="${side}" data-pid="${p.id}" aria-pressed="${st.sel[side].has(p.id)}">
        <span class="calc-name">${c.pname(p.id)}${p.ir ? ' <span class="chip warn">IR</span>' : ''}</span>
        <span class="calc-nums"><b>${num(p.value)}</b><small>${p.ppg.toFixed(1)} ppg</small></span></button>`).join('');
    }).join('');
    const ps = picked(side);
    return `<div class="card calc-side">
      <label class="calc-label">Team ${side.toUpperCase()} <select id="calc-team-${side}" data-side="${side}">${opts}</select></label>
      <div class="calc-roster">${groups || '<p class="empty">No players.</p>'}</div>
      <p class="calc-foot">${ps.length} selected · value ${num(sum(ps))}</p></div>`;
  }

  function impactRow(side, imp) {
    const drops = imp.drops.length ? imp.drops.map(id => c.pname(id)).join(', ') : '<span class="muted">none</span>';
    return `<tr${c.isMe(st[side]) ? ' class="mine"' : ''}><td>${c.teamName(st[side])}</td><td class="num">${imp.before.toFixed(1)}</td>
      <td class="num">${imp.after.toFixed(1)}</td><td class="num pts ${c.ptsCls(imp.delta)}">${c.fmt(imp.delta)}</td><td>${drops}</td></tr>`;
  }

  function result() {
    const [pa, pb] = [picked('a'), picked('b')];
    if (!pa.length && !pb.length) return '<div class="card"><p class="empty">Click players on either side to build a trade.</p></div>';
    const [va, vb] = [sum(pa), sum(pb)];
    const v = CALC.verdict(va, vb);
    const who = v.ahead ? `${c.teamName(st[v.ahead === 'A' ? 'a' : 'b'])} comes out ahead by ${num(v.gap)}` : `Within ${num(v.gap)} of even`;
    const ia = CALC.lineupImpact(roster('a'), data.slots, pa.map(p => p.id), pb);
    const ib = CALC.lineupImpact(roster('b'), data.slots, pb.map(p => p.id), pa);
    return `<div class="card"><h3>Result</h3>
      <div class="score">
        <div><span>${c.teamName(st.a)} sends</span><b>${num(va)}</b><small>receives ${num(vb)}</small></div>
        <div><span>${c.teamName(st.b)} sends</span><b>${num(vb)}</b><small>receives ${num(va)}</small></div>
        <div><span>Verdict</span><b>${c.esc(v.tier)}</b><small>${who}</small></div>
      </div>
      <p class="note">Value is FantasyCalc redraft trade value (players without a value count as 0). Tiers by value gap: Even under 500, Slight Edge 500-1,500, Good Win 1,500-3,000, Clear Win 3,000-5,000, Fleece 5,000+.</p>
      <h4>Lineup impact</h4>
      <div class="table-wrap"><table><thead><tr><th>Team</th><th class="num">Best lineup before</th><th class="num">After</th><th class="num">Change</th><th>Must drop</th></tr></thead>
      <tbody>${impactRow('a', ia)}${impactRow('b', ib)}</tbody></table></div>
      <p class="note">Best possible weekly lineup using each player's points per game this season; IR players cannot start. A team that gets more players than it sends drops its lowest-scoring bench players to stay at roster size.</p>
      </div>${partner(va - vb, ib.delta)}`;
  }

  function partner(valueNet, lineupDelta) {
    const t = data.tendencies[st.b] ?? { trades: 0, withMe: 0, daysSince: null };
    const s = CALC.acceptance(valueNet, lineupDelta, t);
    const last = t.daysSince === null ? 'never' : t.daysSince === 0 ? 'today' : `${t.daysSince} days ago`;
    return `<div class="card"><h3>${c.teamName(st.b)} as a trade partner</h3>
      <div class="score">
        <div><span>Trades this season</span><b>${t.trades}</b><small>${t.withMe} with ${c.teamName(data.myTeamId)}</small></div>
        <div><span>Last trade</span><b>${c.esc(last)}</b><small>&nbsp;</small></div>
        <div><span>Acceptance outlook</span><b>${s.total}/100</b><small>value ${s.value}/60 · lineup ${s.lineup}/25 · activity ${s.activity}/15</small></div>
      </div>
      <p class="note">A rough fit score, not a probability. Value fit: 30 at an even trade, plus 1 per 100 value they gain (0-60). Lineup fit: 12.5 plus 2.5 per point their best lineup gains (0-25). Activity: 3 per trade made (up to 3) plus 6 if they traded in the last 14 days, 3 if in the last 30. Trade counts come from accepted trades, vetoed ones included, matched to players that moved between rosters; a vetoed trade's partner is guessed from the last offer between the two teams.</p></div>`;
  }

  function draw() {
    el.innerHTML = `<p class="muted">Build a trade between any two teams. Values update as you click.</p>
      <div class="calc-sides">${picker('a')}${picker('b')}</div>${result()}`;
  }

  el.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.calc-player');
    if (!btn) return;
    const set = st.sel[btn.dataset.side], id = Number(btn.dataset.pid);
    if (set.has(id)) set.delete(id); else set.add(id);
    draw();
  });
  el.addEventListener('change', (ev) => {
    const side = ev.target.dataset?.side;
    if (!side || ev.target.tagName !== 'SELECT') return;
    st[side] = Number(ev.target.value);
    st.sel[side] = new Set();
    draw();
  });
  draw();
});

// Trade Finder tab: ranked trade list, a multi-team calculator and trade pairs, from DATA.sections.tradev2.
// The calculator runs the real TypeScript engine (page/bundle.ts puts it in function V2_ENGINE) inside a
// Web Worker, so the page stays responsive while it simulates. TV2 holds the pure helpers the tests check.
const TV2 = (() => {
  const FC_TIERS = [[5000, 'Fleece'], [3000, 'Clear Win'], [1500, 'Good Win'], [500, 'Slight Edge']];
  const fcTier = (gap) => FC_TIERS.find(([min]) => Math.abs(gap) >= min)?.[1] ?? 'Even';
  // Tier plus who it favors (gap = value I get minus value I give), same words as sections/tradev2.ts.
  const fcSide = (gap) => (fcTier(gap) === 'Even' ? 'Even' : `${fcTier(gap)} for ${gap > 0 ? 'you' : 'them'}`);
  const band = (p) => (p >= 0.6 ? 'high' : p >= 0.35 ? 'mid' : 'low');
  const SORTS = { best: t => t.score, gain: t => t.myPo, accept: t => t.accept };
  function rows(trades, { team = '', sort = 'best', rb = false }, posOf) {
    return trades.filter(t => (!team || t.partner === Number(team)) && (!rb || t.get.some(id => posOf(id) === 'RB')))
      .sort((a, b) => SORTS[sort](b) - SORTS[sort](a));
  }
  // evaluateMulti may answer with an array of per-team entries or an object keyed by team id.
  function byTeam(r) {
    const src = r && r.teams ? r.teams : r;
    if (Array.isArray(src)) return Object.fromEntries(src.map(e => [e.team ?? e.teamId ?? e.id, e]));
    return src ?? {};
  }
  // FantasyCalc value each team receives minus what it sends.
  function fcNet(moves, fcOf) {
    const net = {};
    for (const m of moves) {
      const v = fcOf(m.playerId);
      net[m.to] = (net[m.to] ?? 0) + v;
      net[m.from] = (net[m.from] ?? 0) - v;
    }
    return net;
  }
  // Trades from the list (each: partner, give, get) as calculator columns and moves.
  function load(me, trades) {
    const teams = [me, ...new Set(trades.map(t => t.partner))].slice(0, 3);
    const moves = new Map();
    for (const t of trades) {
      t.give.forEach(id => moves.set(id, t.partner));
      t.get.forEach(id => moves.set(id, me));
    }
    return { teams, moves };
  }
  return { fcTier, fcSide, band, rows, byTeam, fcNet, load };
})();

TAB('tradev2', (el, data, c) => {
  if (!data || !data.engine) { el.innerHTML = '<p class="empty">No trade data yet. Run node refresh.ts.</p>'; return; }
  const me = c.me();
  const P = data.players ?? {};
  // sections/tradev2.ts sends odds in percentage points (17.02 = 17%); evaluateMulti returns fractions.
  // Convert once here so everything below works in fractions.
  const f = (x) => (x ?? 0) / 100;
  data = {
    ...data,
    base: Object.fromEntries(Object.entries(data.base).map(([id, b]) => [id, { ...b, playoff: f(b.playoff), title: f(b.title) }])),
    trades: data.trades.map(t => ({ ...t, myPo: f(t.myPo), myTi: f(t.myTi), theirPo: f(t.theirPo), theirTi: f(t.theirTi) })),
    combos: data.combos.map(x => ({ ...x, po: f(x.po), ti: f(x.ti), sumSingles: f(x.sumSingles) })),
  };
  // engine.players is keyed by player id (v2/engine.ts EnginePayload)
  const enginePlayers = new Map(Object.entries(data.engine.players ?? {}).map(([id, p]) => [Number(id), p]));
  const rosters = Object.fromEntries((data.engine.teams ?? []).map(t => [t.id, t.roster]));
  const teamIds = Object.keys(rosters).map(Number);
  const owner = new Map(teamIds.flatMap(t => rosters[t].map(id => [id, t])));
  const byId = new Map(data.trades.map((t, k) => [t.id ?? k, t]));
  const st = {
    view: 'list', f: { team: '', sort: 'best', rb: false },
    teams: [me, teamIds.find(t => t !== me)], moves: new Map(), pending: null,
    sims: 2000, running: false, status: '', run: null, err: '',
  };

  const info = (id) => {
    const p = DATA.players[id], e = enginePlayers.get(id);
    return p ? c.player(id) : { id, name: e?.name ?? 'Unknown player', pos: e?.pos ?? '?', injury: e?.inj ?? '', ppg: 0 };
  };
  const pname = (id) => { const p = info(id); return `<span class="pos">${c.esc(p.pos)}</span>${c.esc(p.name)}`; };
  const names = (ids) => ids.map(pname).join('<br>');
  const pts = (x) => `<span class="pts ${c.ptsCls(x)}">${c.fmt(x * 100)}</span>`;
  const num = (x) => Math.round(x).toLocaleString();
  const fcOf = (id) => P[id]?.fc ?? 0;
  const chip = (p) => `<span class="chip tv2-${TV2.band(p)}">${Math.round(p * 100)}%</span>`;
  const cell = (label, value, note = '') => `<div><span>${label}</span><b>${value}</b>${note ? `<small>${note}</small>` : ''}</div>`;
  const moveList = () => [...st.moves].map(([playerId, to]) => ({ playerId, from: owner.get(playerId), to }));

  function strip() {
    const t = c.team(me), b = data.base[me] ?? { playoff: 0, title: 0 };
    return `<div class="score">${cell('Record', `${t.wins}-${t.losses}`, 'includes median games')}
      ${cell('Playoff odds now', c.pct(b.playoff, 1), 'chance you make the top 6')}
      ${cell('Title odds now', c.pct(b.title, 1), 'chance you win it all')}
      ${cell('Trades found', data.trades.length, 'that raise your playoff odds')}</div>`;
  }

  function listView() {
    const posOf = (id) => info(id).pos;
    const rows = TV2.rows(data.trades.slice(), st.f, posOf);
    const partners = [...new Set(data.trades.map(t => t.partner))];
    const opt = (v, label, cur) => `<option value="${v}"${String(cur) === String(v) ? ' selected' : ''}>${label}</option>`;
    const base = data.base[me]?.playoff ?? 0;
    const body = rows.map(t => `<tr class="tv2-row" tabindex="0" data-k="${c.esc(t.id ?? data.trades.indexOf(t))}">
      <td>${c.teamName(t.partner)}${t.similar ? `<br><small class="muted">+${t.similar} similar</small>` : ''}</td>
      <td>${names(t.give)}</td><td>${names(t.get)}</td>
      <td class="num">${c.pct(base + t.myPo, 1)}<br>${pts(t.myPo)}</td>
      <td class="num">${pts(t.myTi)}</td><td>${chip(t.accept)}</td>
      <td class="num">${pts(t.theirPo)}</td>
      <td>${t.fcTier ? `<span class="chip" title="FantasyCalc value gap ${num(t.fcGap ?? 0)}">${c.esc(t.fcTier)}</span>` : ''}</td></tr>`).join('');
    return `<div class="filters">
      <label>Team <select id="tv2-f-team" data-f="team">${opt('', 'All teams', st.f.team)}${partners.map(p => opt(p, c.teamName(p), st.f.team)).join('')}</select></label>
      <label>Sort <select id="tv2-f-sort" data-f="sort">${opt('best', 'Best overall (gain x chance they accept)', st.f.sort)}${opt('gain', 'Biggest playoff-odds gain', st.f.sort)}${opt('accept', 'Most likely accepted', st.f.sort)}</select></label>
      <label><input type="checkbox" id="tv2-f-rb" data-f="rb"${st.f.rb ? ' checked' : ''}> Must include an RB I get</label>
      <span class="count">${rows.length} shown</span></div>
      <div class="table-wrap"><table class="tv2-table"><thead><tr><th>Partner</th><th>You give</th><th>You get</th>
      <th class="num">Your playoff odds</th><th class="num">Title odds</th><th>Chance they accept</th><th class="num">Their real odds</th><th>FantasyCalc</th></tr></thead>
      <tbody>${body || '<tr><td colspan="8" class="empty">No trades match these filters.</td></tr>'}</tbody></table></div>
      <p class="note">Click a row to open it in the Calculator. Odds changes are in percentage points. "Their real odds" is what the trade really does to their playoff odds, for information only. FantasyCalc is a public trade chart, shown as a second opinion; it does not feed the odds.</p>`;
  }

  function combosView() {
    const label = (id) => { const t = byId.get(id); return t ? `${c.teamName(t.partner)}<br><small>give ${names(t.give)}<br>get ${names(t.get)}</small>` : 'Unknown trade'; };
    const body = (data.combos ?? []).map((x, k) => `<tr class="tv2-combo" tabindex="0" data-k="${k}"><td>${label(x.a)}</td><td>${label(x.b)}</td>
      <td class="num">${pts(x.po)}</td><td class="num">${pts(x.sumSingles)}</td><td class="num">${pts(x.ti)}</td><td>${chip(x.bothAccept)}</td></tr>`).join('');
    return `<div class="table-wrap"><table class="tv2-table"><thead><tr><th>Trade 1</th><th>Trade 2</th><th class="num">Both together: playoff odds</th>
      <th class="num">Sum of the two alone</th><th class="num">Title odds</th><th>Both accept</th></tr></thead>
      <tbody>${body || '<tr><td colspan="6" class="empty">No pairs found.</td></tr>'}</tbody></table></div>
      <p class="note">Pairs of trades with different partners and no shared players, simulated together. When "both together" is close to the sum, the two trades do not get in each other's way. Click a pair to open both in the Calculator.</p>`;
  }

  function column(t, i) {
    const opts = teamIds.filter(id => id === t || !st.teams.includes(id))
      .map(id => `<option value="${id}"${id === t ? ' selected' : ''}>${c.teamName(id)}${c.isMe(id) ? ' (you)' : ''}</option>`).join('');
    const head = i === 0 ? `<h3>${c.teamName(t)} (you)</h3>`
      : `<div class="tv2-head"><label class="tv2-pick">Team <select id="tv2-team-${i}" data-col="${i}">${opts}</select></label>
         ${st.teams.length > 2 ? `<button type="button" class="tv2-link" data-remove="${i}">Remove</button>` : ''}</div>`;
    const list = [...(rosters[t] ?? [])].sort((a, b) => (P[b]?.m ?? 0) - (P[a]?.m ?? 0)).map(id => {
      const p = info(id), x = P[id] ?? {}, to = st.moves.get(id);
      const nums = [`${(x.m ?? 0).toFixed(1)} pts/g`, x.rank ? `#${x.rank}` : '', x.fc ? `FC ${num(x.fc)}` : ''].filter(Boolean).join(' · ');
      const choose = st.pending === id ? `<div class="tv2-choose">Send to ${st.teams.filter(o => o !== t)
        .map(o => `<button type="button" data-to="${o}">${c.teamName(o)}</button>`).join(' ')}</div>` : '';
      return `<button type="button" class="tv2-p" data-pid="${id}" aria-pressed="${to !== undefined}">
        <span>${pname(id)}${c.injuryChip(p.injury)}${to !== undefined ? ` <span class="chip">to ${c.teamName(to)}</span>` : ''}</span>
        <small>${nums}</small></button>${choose}`;
    }).join('');
    const gets = moveList().filter(m => m.to === t).map(m => pname(m.playerId)).join(', ');
    return `<div class="card tv2-col">${head}<div class="tv2-roster">${list || '<p class="empty">No players.</p>'}</div>
      <p class="tv2-foot">Gets: ${gets || '<span class="muted">nothing yet</span>'}</p></div>`;
  }

  function calcView() {
    const add = st.teams.length < 3 ? '<button type="button" class="tv2-add" id="tv2-add">+ Add team</button>' : '';
    return `<p class="muted">Click a player to send him${st.teams.length > 2 ? ', then pick who receives him' : ' to the other team'}. Click again to take him back.</p>
      <div class="tv2-cols">${st.teams.map(column).join('')}${add}</div>
      <div class="filters"><label>Simulated seasons <select id="tv2-sims">${[2000, 5000].map(n => `<option value="${n}"${n === st.sims ? ' selected' : ''}>${n.toLocaleString()}</option>`).join('')}</select></label>
      <button type="button" class="tv2-run" id="tv2-run"${st.running ? ' disabled' : ''}>${st.running ? 'Working...' : 'Run trade'}</button>
      <span id="tv2-status" class="muted" role="status" aria-live="polite">${c.esc(st.status)}</span></div>
      ${st.err ? `<p class="empty">${c.esc(st.err)}</p>` : ''}${results()}`;
  }

  function results() {
    if (!st.run) return '<div class="card"><p class="empty">Pick players and press Run trade.</p></div>';
    const { r, teams, moves, sims } = st.run;
    const mine = r[me] ?? unchanged(me);
    const stale = JSON.stringify(moves) !== JSON.stringify(moveList()) ? '<p class="note">You changed the trade since this run; press Run trade again.</p>' : '';
    const net = TV2.fcNet(moves, fcOf);
    const fcCells = teams.map(t => cell(`${c.teamName(t)} FantasyCalc`, `<span class="pts ${c.ptsCls(net[t] ?? 0)}">${c.fmt(net[t] ?? 0, 0)}</span>`,
      t === me ? c.esc(TV2.fcSide(net[t] ?? 0)) : 'value in minus value out')).join('');
    return `<div class="card"><h3>What it does for you</h3>${stale}<div class="score">
      ${cell('Your playoff odds', c.pct(mine.poAfter ?? 0, 1), `was ${c.pct(mine.poBefore ?? 0, 1)} · ${pts((mine.poAfter ?? 0) - (mine.poBefore ?? 0))} pts`)}
      ${cell('Your title odds', c.pct(mine.tiAfter ?? 0, 1), `was ${c.pct(mine.tiBefore ?? 0, 1)} · ${pts((mine.tiAfter ?? 0) - (mine.tiBefore ?? 0))} pts`)}
      ${cell('Your lineup', `<span class="pts ${c.ptsCls(mine.lineupDelta ?? 0)}">${c.fmt(mine.lineupDelta ?? 0)}</span>`, 'expected starting points per week')}</div>
      <p class="note">${sims.toLocaleString()} simulated seasons, the same random draws before and after the trade, so the difference comes from the trade. Expect about 1 point of noise at 2,000; 5,000 is steadier but slower.</p></div>
      ${teams.filter(t => t !== me).map(t => partnerCard(t, r[t])).join('')}
      <div class="card"><h3>FantasyCalc second opinion</h3><div class="score">${fcCells}</div>
      <p class="note">Public trade-chart value. Tiers by your gap: Even under 500, Slight Edge 500-1,500, Good Win 1,500-3,000, Clear Win 3,000-5,000, Fleece 5,000+. It does not feed the odds.</p></div>`;
  }

  // A team the trade does not touch is missing from the engine's answer: its odds stay at today's.
  function unchanged(t) {
    const b = data.base[t] ?? { playoff: 0, title: 0 };
    return { poBefore: b.playoff, poAfter: b.playoff, tiBefore: b.title, tiAfter: b.title, lineupDelta: 0 };
  }

  function partnerCard(t, entry) {
    const td = data.tendencies?.[t] ?? {}, e = entry ?? unchanged(t);
    const bump = e.bump ? '<p class="note">Their lineup change includes a +0.5 boost because the trade fits what they have tried to trade for before.</p>' : '';
    const last = td.daysSinceLast == null ? 'never' : td.daysSinceLast === 0 ? 'today' : `${td.daysSinceLast} days ago`;
    const list = (xs) => (xs?.length ? xs.map(c.esc).join(', ') : 'nothing noted');
    const accept = entry ? cell('Chance they accept', chip(e.pAccept ?? 0), `their lineup as they see it ${c.fmt(e.dPv ?? 0)} pts/week · trade-chart balance ${c.fmt((e.mb ?? 0) * 100, 0)}%`) : '';
    const none = entry ? '' : '<p class="note">No players move for this team, so it has nothing to accept.</p>';
    return `<div class="card"><h3>${c.teamName(t)}</h3>${none}<div class="score">
      ${accept}
      ${cell('Their real playoff odds', pts((e.poAfter ?? 0) - (e.poBefore ?? 0)), `${c.pct(e.poBefore ?? 0, 1)} to ${c.pct(e.poAfter ?? 0, 1)}`)}
      ${cell('Their lineup', `<span class="pts ${c.ptsCls(e.lineupDelta ?? 0)}">${c.fmt(e.lineupDelta ?? 0)}</span>`, 'our model, points per week')}</div>${bump}
      <dl class="tv2-tend"><div><dt>Trades this season</dt><dd>${td.trades ?? 0} (${td.withMe ?? 0} with you)</dd></div>
      <div><dt>Last trade</dt><dd>${c.esc(last)}</dd></div><div><dt>Has tried to get</dt><dd>${list(td.seeks)}</dd></div>
      <div><dt>Has tried to move</dt><dd>${list(td.sells)}</dd></div>
      <div><dt>Consolidator</dt><dd>${td.consolidator ? 'yes, likes 2-for-1 deals' : 'no'}</dd></div></dl></div>`;
  }

  const WATCHDOG_MS = 60000; // a run that has not answered by then is treated as stuck
  let worker = null, sentEngine = false, timer = 0, watchdog = 0, reqId = 0;
  function engineWorker() {
    if (worker) return worker;
    const src = `(${V2_ENGINE.toString()})();
let engine = null;
const ctxs = {}; // the simulated seasons are drawn once per season count, then every trade reuses them
onmessage = (e) => {
  try {
    if (e.data.engine) engine = e.data.engine;
    const { id, sims, moves } = e.data, opts = { sims, seed: engine.seed };
    if (!ctxs[sims]) ctxs[sims] = V2.ctxFromEngine(engine, opts);
    postMessage({ id, result: V2.evaluateMulti(ctxs[sims], moves, opts) });
  } catch (err) { postMessage({ id: e.data && e.data.id, error: String((err && err.message) || err) }); }
};`;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = (ev) => finish(ev.data);
    worker.onerror = (ev) => { stopWorker(); finish({ id: reqId, error: ev.message || 'The simulation stopped with an error.' }); };
    sentEngine = false;
    return worker;
  }
  function stopWorker() {
    try { worker?.terminate(); } catch { /* already gone */ }
    worker = null; sentEngine = false;
  }
  // Only the latest run's answer counts: a slower earlier run must not land under a different trade.
  function finish(msg) {
    if (!msg || msg.id !== reqId || !st.running) return;
    clearInterval(timer); clearTimeout(watchdog);
    st.running = false; st.status = '';
    if (msg.error) st.err = `The simulation failed: ${msg.error}`;
    else st.run = { ...st.pendingRun, r: TV2.byTeam(msg.result) };
    draw();
  }
  function run() {
    const moves = moveList();
    st.err = '';
    if (!moves.length) { st.err = 'Pick at least one player to move.'; return draw(); }
    if (typeof V2_ENGINE !== 'function' || typeof Worker !== 'function') { st.err = 'The simulation engine is not in this page.'; return draw(); }
    st.running = true; st.pendingRun = { teams: [...st.teams], moves, sims: st.sims };
    const t0 = Date.now();
    st.status = `Simulating ${st.sims.toLocaleString()} seasons...`;
    timer = setInterval(() => { const s = document.getElementById('tv2-status'); if (s) s.textContent = `${st.status} ${Math.round((Date.now() - t0) / 1000)}s`; }, 500);
    const id = ++reqId;
    clearTimeout(watchdog);
    watchdog = setTimeout(() => { stopWorker(); finish({ id, error: 'no answer after 60 seconds. Try again, or pick 2,000 seasons.' }); }, WATCHDOG_MS);
    draw();
    try {
      const w = engineWorker();
      w.postMessage({ id, engine: sentEngine ? null : data.engine, moves, sims: st.sims });
      sentEngine = true;
    } catch (err) {
      stopWorker();
      finish({ id, error: String((err && err.message) || err) });
    }
  }

  function draw() {
    const focus = typeof document !== 'undefined' ? document.activeElement?.id : '';
    const seg = [['list', 'Trade list'], ['calc', 'Calculator'], ['combos', 'Combinations']]
      .map(([v, l]) => `<button type="button" data-view-btn="${v}" aria-pressed="${st.view === v}">${l}</button>`).join('');
    const view = { list: listView, calc: calcView, combos: combosView }[st.view]();
    el.innerHTML = `${strip()}<div class="seg" role="group" aria-label="Trade views">${seg}</div><div class="stack">${view}</div>
      <p class="note">Chance they accept is an estimate built from reasoning about how managers judge trades (their lineup as they see it, plus trade-chart balance); it has not been fitted to real accept and decline behaviour in this league. This page never sends trades: make any offer yourself in ESPN.</p>`;
    if (focus) document.getElementById(focus)?.focus();
  }

  function openTrades(trades) {
    Object.assign(st, TV2.load(me, trades), { view: 'calc', pending: null, run: null, err: '' });
    if (st.teams.length < 2) st.teams.push(teamIds.find(t => t !== me));
    run();
  }

  el.addEventListener('click', (ev) => {
    const t = ev.target;
    const btn = t.closest('[data-view-btn]');
    if (btn) { st.view = btn.dataset.viewBtn; return draw(); }
    const row = t.closest('tr.tv2-row');
    if (row) return openTrades([byId.get(isNaN(row.dataset.k) ? row.dataset.k : Number(row.dataset.k))].filter(Boolean));
    const combo = t.closest('tr.tv2-combo');
    if (combo) { const x = data.combos[Number(combo.dataset.k)]; return openTrades([byId.get(x.a), byId.get(x.b)].filter(Boolean)); }
    const to = t.closest('[data-to]');
    if (to) { st.moves.set(st.pending, Number(to.dataset.to)); st.pending = null; return draw(); }
    const p = t.closest('.tv2-p');
    if (p) {
      const id = Number(p.dataset.pid);
      if (st.moves.has(id) || st.pending === id) { st.moves.delete(id); st.pending = null; }
      else if (st.teams.length === 2) st.moves.set(id, st.teams.find(x => x !== owner.get(id)));
      else st.pending = id;
      return draw();
    }
    const rm = t.closest('[data-remove]');
    if (rm) { setTeam(Number(rm.dataset.remove), null); return draw(); }
    if (t.closest('#tv2-add')) { st.teams.push(teamIds.find(x => !st.teams.includes(x))); return draw(); }
    if (t.closest('#tv2-run')) run();
  });
  el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.matches?.('tr.tv2-row, tr.tv2-combo')) ev.target.click(); });

  // Replace (or with null, remove) the team in column i; any move touching the old team is undone.
  function setTeam(i, next) {
    const old = st.teams[i];
    for (const [id, to] of [...st.moves]) if (to === old || owner.get(id) === old) st.moves.delete(id);
    st.pending = null;
    if (next === null) st.teams.splice(i, 1); else st.teams[i] = next;
  }

  el.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.dataset.f) { st.f[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; return draw(); }
    if (t.dataset.col) { setTeam(Number(t.dataset.col), Number(t.value)); return draw(); }
    if (t.id === 'tv2-sims') st.sims = Number(t.value);
  });
  draw();
});

// Zach Finder tab: per team, every trade (up to 3-for-2) that raises Noah's starting lineup, judged only by Zach Savage's
// Flock ranks. data = build() in sections/zachfinder.ts; trades arrive sorted by Noah's gain (`me`), best first.
TAB('zachfinder', (el, data, c) => {
  if (!data || data.error) {
    el.innerHTML = `<p class="empty">${c.esc(data?.error ?? 'No Zach Finder data in this page yet. Press Refresh.')}</p>`;
    return;
  }
  const PAGE = 40;
  const FILTERS = [
    { id: 'all', label: 'Every trade that helps you', ok: () => true },
    { id: 'holds', label: 'Their lineup holds', ok: (t) => t.them >= 0 },
    { id: 'fc', label: 'FantasyCalc says they win', ok: (t) => t.fc >= 0 },
  ];
  const num = (x) => Math.round(Math.abs(x)).toLocaleString();
  const rankText = (id) => data.ranks[id] == null ? 'unranked' : `#${data.ranks[id]}`;
  const name = (id) => c.esc(c.player(id).name);
  const hurt = (id) => c.injuryChip(c.player(id).injury);
  const playerCell = (ids) => ids.map(id => `<span class="zf-p">${c.pname(id)} <span class="chip">${rankText(id)}</span>${hurt(id)}</span>`).join('');
  const shortTrade = (t) => `Give ${t.give.map(name).join(', ')} for ${t.get.map(name).join(', ')}`;
  const fcText = (fc) => fc > 0 ? `they win by ${num(fc)}` : fc < 0 ? `you win by ${num(fc)}` : 'even';
  const st = { filter: 'all', team: null, shown: PAGE };

  const passing = (team) => team.trades.filter(FILTERS.find(f => f.id === st.filter).ok);
  const best = (team) => passing(team)[0] ?? null;
  const byBest = () => [...data.teams].sort((a, b) => (best(b)?.me ?? -1) - (best(a)?.me ?? -1));
  st.team = byBest()[0]?.id ?? null;

  function dateText() {
    const d = new Date(`${String(data.updated).slice(0, 10)}T12:00`);
    return isNaN(d) ? c.esc(data.updated) : d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function header() {
    const qb = data.protect ? `your QB, ${name(data.protect)}, who` : 'your QB, who';
    return `<p class="zf-lede">Trades judged only by Zach Savage's Flock rankings, updated ${dateText()}.</p>
      <p class="note">Your gain is how much your best starting lineup improves. Each player's Zach rank becomes points on a curve
      (rank 1 = 1000, falling as the rank gets worse), so swapping a #62 flex for a #17 is about +170. Players Zach does not rank count as 0.
      A QB only shows up if Zach ranks him at least ${data.qbUpgrade} spots above ${qb} is never offered.
      Their lineup is the same measure for the other team (negative means they get worse). FantasyCalc is the public trade
      calculator's value of what they get minus what they send. Every player you get would start for you. Ranks are rest-of-season, so 'starts' means once healthy; players on IR count at Zach's rank.
      "They drop N" means the other team gets more players than it sends and must cut N to make room.</p>
      <div class="seg" role="group" aria-label="Which trades to show">${FILTERS.map(f =>
        `<button type="button" data-zf-filter="${f.id}" aria-pressed="${f.id === st.filter}">${f.label}</button>`).join('')}</div>
      <h3>Best trade with each team</h3>
      <div class="table-wrap"><table><thead><tr><th>Team and its best trade</th><th class="num">Your gain</th></tr></thead>
      <tbody id="zf-sum"></tbody></table></div>
      <div class="filters"><label>Team <select id="zf-team"></select></label><span class="count" id="zf-count"></span></div>
      <div class="table-wrap"><table><thead><tr><th>You give</th><th>You get</th><th>Lineup change</th><th class="num">Your gain</th>
      <th class="num">Their lineup</th><th>FantasyCalc</th></tr></thead><tbody id="zf-rows"></tbody></table></div>
      <div class="seg" id="zf-more-wrap"><button type="button" id="zf-more">Show more</button></div>`;
  }

  function summaryRow(team) {
    const t = best(team);
    const on = team.id === st.team ? ' zf-on' : '';
    return `<tr class="zf-pick${on}" data-zf-team="${team.id}"><td><button type="button" class="zf-team" data-zf-team="${team.id}">${c.teamName(team.id)}</button>
      <span class="zf-sub">${t ? shortTrade(t) : 'No trade under this filter'}</span></td>
      <td class="num">${t ? `<span class="pts up">+${num(t.me)}</span>` : '<span class="muted">none</span>'}</td></tr>`;
  }

  function changeCell(t) {
    const ins = t.ins.map(id => `<span class="zf-chg in">${name(id)} ${rankText(id)} starts${hurt(id)}</span>`);
    const outs = t.outs.map(id => `<span class="zf-chg out">${name(id)} ${rankText(id)} ${t.give.includes(id) ? 'traded away' : 'to bench'}${hurt(id)}</span>`);
    return [...ins, ...outs].join('');
  }

  function tradeRow(t) {
    return `<tr><td>${playerCell(t.give)}</td><td>${playerCell(t.get)}</td><td>${changeCell(t)}</td>
      <td class="num"><span class="pts up">+${num(t.me)}</span></td>
      <td class="num"><span class="pts ${c.ptsCls(t.them)}">${c.fmt(t.them, 0)}</span>${t.extra > 0 ? `<span class="zf-sub">they drop ${t.extra}</span>` : ''}</td>
      <td>${fcText(t.fc)}</td></tr>`;
  }

  function teamOptions() {
    return byBest().map(team => {
      const t = best(team);
      return `<option value="${team.id}"${team.id === st.team ? ' selected' : ''}>${c.teamName(team.id)} (${t ? `best +${num(t.me)}` : 'none'})</option>`;
    }).join('');
  }

  function draw() {
    const team = data.teams.find(x => x.id === st.team);
    const rows = team ? passing(team) : [];
    el.querySelector('#zf-sum').innerHTML = byBest().map(summaryRow).join('');
    el.querySelector('#zf-team').innerHTML = teamOptions();
    el.querySelector('#zf-count').textContent = `${Math.min(st.shown, rows.length)} of ${rows.length} trades`;
    el.querySelector('#zf-rows').innerHTML = rows.length ? rows.slice(0, st.shown).map(tradeRow).join('')
      : '<tr><td colspan="6" class="empty">No trade with this team passes this filter.</td></tr>';
    el.querySelector('#zf-more-wrap').hidden = rows.length <= st.shown;
  }

  function pickTeam(id) { st.team = id; st.shown = PAGE; draw(); }

  if (!data.teams.length) { el.innerHTML = '<p class="empty">No other teams found in this league.</p>'; return; }
  el.innerHTML = header();
  el.addEventListener('click', (ev) => {
    const f = ev.target.closest('[data-zf-filter]');
    if (f) {
      st.filter = f.dataset.zfFilter;
      st.shown = PAGE;
      for (const b of el.querySelectorAll('[data-zf-filter]')) b.setAttribute('aria-pressed', String(b === f));
      return draw();
    }
    if (ev.target.closest('#zf-more')) { st.shown += PAGE; return draw(); }
    const row = ev.target.closest('[data-zf-team]');
    if (!row) return;
    pickTeam(Number(row.dataset.zfTeam));
    el.querySelector('#zf-team').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
  el.querySelector('#zf-team').addEventListener('change', (ev) => pickTeam(Number(ev.target.value)));
  draw();
});

// Waivers tab: graded claim slips, per-team waiver leaderboard, pickup targets.
TAB('waivers', (el, data, c) => {
  const GRADES = ['Jackpot', 'Great Add', 'Good Add', 'Even', 'Depth', 'Miss', 'Cut early', 'Pending'];
  const HITS = new Set(['Jackpot', 'Great Add', 'Good Add']);
  const MEANING = { 'Jackpot': '20+ pts added', 'Great Add': '10 to 20', 'Good Add': '3 to 10', 'Even': 'within 3 either way',
    'Depth': 'never made the best lineup', 'Miss': 'dropped player would have scored 3+ more', 'Cut early': 'gone before he played a graded week',
    'Pending': 'no finished week yet' };
  const pill = (g) => `<span class="pill g-${g.replace(' ', '-')}">${g}</span>`;

  const stats = DATA.teams.map(t => {
    const cs = data.claims.filter(x => x.team === t.id);
    const graded = cs.filter(x => x.label !== 'Pending' && x.label !== 'Cut early');
    return { ...t, claims: cs.length, gain: graded.reduce((s, x) => s + x.gain, 0), graded: graded.length,
      hits: graded.filter(x => HITS.has(x.label)).length, misses: graded.filter(x => x.label === 'Miss').length,
      best: [...graded].sort((a, b) => b.gain - a.gain)[0] };
  }).sort((a, b) => b.gain - a.gain);

  function verdict(x) {
    const wks = x.byWeek.length, span = `${wks} week${wks === 1 ? '' : 's'}`;
    if (x.label === 'Pending') return 'Not graded yet: no finished week since this claim.';
    if (x.label === 'Cut early') return 'Dropped again before he played a week on this roster.';
    if (x.label === 'Depth') return `Sat on the bench for ${span}; never made the best lineup.`;
    const vs = x.drop ? `instead of ${c.esc(c.player(x.drop).name)}` : 'with the open spot';
    return `<span class="pts ${c.ptsCls(x.gain)}">${c.fmt(x.gain)} pts</span> to the best lineup over ${span}, ${vs}.`;
  }

  function slip(x) {
    const when = new Date(x.date).toLocaleDateString([], { month: 'short', day: 'numeric' });
    const rivals = x.type === 'WAIVER' ? `<span class="chip">${x.rivals ? `beat ${x.rivals} other team${x.rivals > 1 ? 's' : ''}` : 'uncontested'}</span>` : '';
    const weeks = x.byWeek.length ? `<details><summary>Week by week</summary><div class="weeks">${x.byWeek.map(w =>
      `<span>Wk ${w.week}: <b class="pts ${c.ptsCls(w.gain)}">${c.fmt(w.gain)}</b>${w.started ? '' : ' bench'}</span>`).join('')}</div></details>` : '';
    return `<article class="slip${c.isMe(x.team) ? ' mine' : ''}">
      <div class="top">${pill(x.label)}<strong>${c.teamName(x.team)}</strong><span>Wk ${x.week} · ${when} · ${x.type === 'WAIVER' ? 'Waiver' : 'Free agent'}</span>${rivals}</div>
      <div class="moves"><span class="add">${c.pname(x.add)}</span>${x.drop ? `<span class="drop">${c.pname(x.drop)}</span>` : ''}</div>
      <div class="verdict">${verdict(x)}</div>${weeks}</article>`;
  }

  const rank = stats.findIndex(t => c.isMe(t.id)), me = stats[rank], top = data.targets[0];
  const best = me?.best && me.best.gain > 0 ? me.best : null;
  el.innerHTML = `
    <div class="score">
      <div><span>Your waiver rank</span><b>#${rank + 1} of ${stats.length}</b></div>
      <div><span>Pts your pickups added</span><b class="pts ${c.ptsCls(me.gain)}">${c.fmt(me.gain)}</b></div>
      <div><span>Hit rate</span><b>${me.hits}/${me.graded}</b><small>Good Add or better</small></div>
      <div><span>Best pickup</span><b>${best ? c.fmt(best.gain) : '—'}</b><small>${best ? c.esc(c.player(best.add).name) : ''}</small></div>
      <div><span>Top target now</span><b>${top ? c.fmt(top.gain) + '/g' : '—'}</b><small>${top ? c.esc(c.player(top.id).name) : 'none'}</small></div>
    </div>
    <div class="seg" role="group" aria-label="Waiver views">
      <button data-v="claims" aria-pressed="true">Claims</button><button data-v="teams" aria-pressed="false">Teams</button><button data-v="targets" aria-pressed="false">Pickup targets</button><button data-v="streamers" aria-pressed="false">Streamers</button>
    </div>
    <div data-view="claims" class="stack">
      <div class="filters">
        <label>Team <select id="w-team"><option value="">All teams</option>${[...DATA.teams].sort((a, b) => a.name.localeCompare(b.name)).map(t => `<option value="${t.id}">${c.esc(t.name)}</option>`).join('')}</select></label>
        <label>Grade <select id="w-grade"><option value="">All grades</option>${GRADES.map(g => `<option>${g}</option>`).join('')}</select></label>
        <label>Type <select id="w-type"><option value="">Waiver + free agent</option><option value="WAIVER">Waiver</option><option value="FREEAGENT">Free agent</option></select></label>
        <span class="count" id="w-count"></span>
      </div>
      <div class="list" id="w-list"></div>
      <div class="legend">${GRADES.map(g => `<span>${pill(g)} ${MEANING[g]}</span>`).join('')}</div>
    </div>
    <div data-view="teams" class="stack" hidden>
      <p class="note">Teams ranked by total points their pickups added to their best possible lineup. Pending and Cut early claims are left out.</p>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>Team</th><th class="num">Claims</th><th class="num">Pts added</th><th class="num">Hits</th><th class="num">Misses</th><th>Best pickup</th></tr></thead><tbody>
      ${stats.map((t, i) => `<tr class="${c.isMe(t.id) ? 'mine' : ''}"><td class="num">${i + 1}</td><td>${c.esc(t.name)}</td><td class="num">${t.claims}</td>
        <td class="num"><span class="pts ${c.ptsCls(t.gain)}">${c.fmt(t.gain)}</span></td><td class="num">${t.hits}/${t.graded}</td><td class="num">${t.misses}</td>
        <td>${t.best && t.best.gain > 0 ? `${c.esc(c.player(t.best.add).name)} <span class="pts up">${c.fmt(t.best.gain)}</span>` : '<span class="muted">none yet</span>'}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
    <div data-view="targets" class="stack" hidden>
      <p class="note">Free agents who would raise your best lineup, by ${DATA.meta.season} points per game (2+ games). The drop is a benched kicker or D/ST first, otherwise your lowest-scoring bench player.</p>
      <div class="table-wrap"><table><thead><tr><th>Pick up</th><th class="num">Pts/game</th><th class="num">Lineup +/game</th><th>Drop</th><th class="num">ESPN rostered</th></tr></thead><tbody>
      ${data.targets.length ? data.targets.map(t => { const p = c.player(t.id); return `<tr><td>${c.pname(t.id)}${c.injuryChip(p.injury)}</td>
        <td class="num">${p.ppg.toFixed(1)}</td><td class="num"><span class="pts up">${c.fmt(t.gain)}</span></td>
        <td>${t.dropId ? c.pname(t.dropId) : '<span class="muted">open spot</span>'}</td><td class="num">${t.owned}%</td></tr>`; }).join('')
        : '<tr><td colspan="5" class="empty">No free agent beats your current lineup right now.</td></tr>'}
      </tbody></table></div>
    </div>
    <div data-view="streamers" class="stack" hidden>
      <p class="note">Kickers and defenses are week-to-week matchup picks, not keepers. Available ones ranked by ESPN's projection for Week ${data.streamers.week}, with Week ${data.streamers.week + 1}'s opponent shown so you can plan the next pickup (ESPN posts next week's projection once this week's games finish). Your current starter is highlighted: anyone above him is an upgrade this week.</p>
      ${['K', 'D/ST'].map(pos => `<h3>${pos === 'K' ? 'Kickers' : 'Defenses'}</h3>
      <div class="table-wrap"><table><thead><tr><th>${pos === 'K' ? 'Kicker' : 'Defense'}</th><th class="num">Wk ${data.streamers.week}</th><th>vs</th><th class="num">Wk ${data.streamers.week + 1}</th><th>vs</th><th class="num">ESPN rostered</th></tr></thead><tbody>
      ${(data.streamers[pos] ?? []).map(x => { const p = c.player(x.id); const n = v => v === null ? '<span class="muted">\u2014</span>' : v.toFixed(1);
        return `<tr class="${x.mine ? 'mine' : ''}"><td>${c.pname(x.id)}${x.mine ? ' <span class="chip">yours</span>' : ''}${c.injuryChip(p.injury)}</td>
        <td class="num">${n(x.proj)}</td><td>${c.esc(x.opp ?? '?')}</td><td class="num">${n(x.projNext)}</td><td>${c.esc(x.oppNext ?? '?')}</td><td class="num">${x.owned}%</td></tr>`; }).join('')
        || '<tr><td colspan="6" class="empty">No projections yet for this week.</td></tr>'}
      </tbody></table></div>`).join('')}
    </div>`;

  const q = (s) => el.querySelector(s);
  function renderClaims() {
    const t = Number(q('#w-team').value) || null, g = q('#w-grade').value, ty = q('#w-type').value;
    const rows = data.claims.filter(x => (!t || x.team === t) && (!g || x.label === g) && (!ty || x.type === ty))
      .sort((a, b) => (a.label === 'Pending') - (b.label === 'Pending') || b.date - a.date);
    q('#w-count').textContent = `${rows.length} of ${data.claims.length} claims`;
    q('#w-list').innerHTML = rows.length ? rows.map(slip).join('') : '<p class="empty">No claims match these filters.</p>';
  }
  for (const id of ['#w-team', '#w-grade', '#w-type']) q(id).addEventListener('change', renderClaims);
  for (const b of el.querySelectorAll('.seg button')) b.addEventListener('click', () => {
    for (const o of el.querySelectorAll('.seg button')) o.setAttribute('aria-pressed', String(o === b));
    for (const v of el.querySelectorAll('[data-view]')) v.hidden = v.dataset.view !== b.dataset.v;
  });
  renderClaims();
});

start();
</script>
